services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
      args:
        # 可选：yyb-go 为私有仓库时传入具备 read 权限的 token；公开仓库留空即可
        - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped
    ports:
      - "${PORT:-3007}:3007"
    volumes:
      - qq-farm-test-data:/app/core/data
      - qq-farm-test-logs:/app/core/data/logs
      # 应用宝 Go 服务的 SQLite 数据库持久化（跨容器重启保留已登录账号）
      - qq-farm-test-yyb-db:/usr/local/share/yyb-go/resource/db
      # QQ 登录由同一 Compose 项目的 NapCat 容器提供，通过共享 Unix Socket 通信。
      - qq-farm-napcat-bridge:/run/qqfarm-napcat-bridge
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NODE_ENV=production
      - ADMIN_PORT=3007
      # ===== 应用宝 Go 服务（同容器内，单镜像共用 3007 出口）=====
      # Node 代理会把 /api/yyb/* 转发到下面的地址；无需在 Web 端再填外部地址
      - YYB_API_URL=http://127.0.0.1:8450
      # 该 token 同时作为：① Go 服务自身的 Bearer 鉴权（YYB_API_TOKEN）② Node 代理转发时携带的 apiKey（YYB_API_KEY）
      - YYB_API_TOKEN=${YYB_API_TOKEN:-}
      - YYB_API_KEY=${YYB_API_TOKEN:-}
      - YYB_PORT=8450
      # Docker NapCat QQ 扫码/OpenAuth 桥接 Socket
      - NAPCAT_BRIDGE_SOCKET=/run/qqfarm-napcat-bridge/bridge.sock
      # 可选：应用宝 Web 管理页登录账密（留空则由服务使用内置默认）
      - YYB_ADMIN_USER=${YYB_ADMIN_USER:-}
      - YYB_ADMIN_PASS=${YYB_ADMIN_PASS:-}
    healthcheck:
      # /api/status 需要鉴权头，且容器内 localhost 解析到 ::1 而服务仅监听 IPv4，故用 127.0.0.1 探测根路径
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3007/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  napcat-farm:
    build:
      context: .
      dockerfile: napcat/Dockerfile.host-runtime
      additional_contexts:
        # /opt/napcat-shell 是软链接；构建上下文直接指向真实目录，
        # 把宿主机已验证可用的 QQ 3.2.29 + NapCat bundle 原样装进镜像。
        host_napcat: /opt/napcat-shell.bak-20260709093049
    image: qq-farm-napcat:host-runtime
    container_name: qq-farm-napcat
    restart: unless-stopped
    volumes:
      # 与宿主机成功链路保持同一路径；卷内迁入宿主机 6099 的配置和登录资料。
      - qq-farm-napcat-data:/opt/napcat-docker
      - qq-farm-napcat-bridge:/run/qqfarm-napcat-bridge
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - NAPCAT_WORKDIR=/opt/napcat-docker
      - NAPCAT_LAUNCH_MODE=process
      - NAPCAT_LAUNCHER=/opt/napcat-shell/start-napcat-xvfb.sh
      - NAPCAT_BRIDGE_SOCKET=/run/qqfarm-napcat-bridge/bridge.sock
      # 【2026-08-19】对齐宕主机 qq-farm-napcat-bridge.service 里显式设的三个变量。
      # 容器化时漏了这三个，全靠代码默认值兜；其中 WebUI 路径的
      # NAPCAT_BASE_URL 默认曾是 3000（错的，农场用 3001），只能靠降级分支探测兵到，
      # 一旦 WebUI 路径先命中就会拿错端口。显式固定，不再依赖默认值。
      - NAPCAT_BASE_URL=http://127.0.0.1:3001
      - NAPCAT_WEBUI_BASE_URL=http://127.0.0.1:6099
      - NAPCAT_TIMEOUT_MS=8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qq-farm-test-data:
    name: qq-farm-test-data
  qq-farm-test-logs:
    name: qq-farm-test-logs
  qq-farm-test-yyb-db:
    name: qq-farm-test-yyb-db
  qq-farm-napcat-data:
    name: qq-farm-napcat-data
  qq-farm-napcat-bridge:
    name: qq-farm-napcat-bridge
