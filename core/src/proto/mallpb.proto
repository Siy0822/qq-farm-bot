syntax = "proto3";

package gamepb.mallpb;

import "corepb.proto";

// 商场服务
service MallService {
  rpc GetMallListBySlotType(GetMallListBySlotTypeRequest) returns (GetMallListBySlotTypeResponse);
  rpc Purchase(PurchaseRequest) returns (PurchaseResponse);
  rpc GetMonthCardInfos(GetMonthCardInfosRequest) returns (GetMonthCardInfosReply);
  rpc ClaimMonthCardReward(ClaimMonthCardRewardRequest) returns (ClaimMonthCardRewardReply);
}

// 获取商场列表请求
message GetMallListBySlotTypeRequest {
  int32 slot_type = 1;  // 商场类型
  // 官方 1.14.2.11 起 field 2 是 is_manual_open（主动打开标记），不是子分类。
  bool is_manual_open = 2;
}

// 获取商场列表响应
message GetMallListBySlotTypeResponse {
  repeated bytes goods_list = 1;  // 商品列表（每个是序列化的MallGoods）
  int64 timestamp = 2;  // 时间戳
}

// 商品信息
message MallGoods {
  int32 goods_id = 1;        // 商品ID
  string name = 2;           // 商品名称
  int32 type = 3;            // 商品类型
  bytes item_ids = 4;        // 物品ID列表（序列化数据）
  bytes price = 5;           // 价格（序列化数据）
  bool is_free = 6;          // 是否免费
  bytes limit = 7;           // 限购信息（序列化数据）
  bool is_limited = 8;       // 是否限购
  string discount = 10;      // 折扣信息
}

// 购买请求
message PurchaseRequest {
  int32 goods_id = 1;  // 商品ID
  int32 count = 2;     // 购买数量
}

// 购买响应
message PurchaseResponse {
  int32 goods_id = 1;     // 商品ID
  int32 count = 2;        // 购买数量
  bytes reward_info = 3;  // 奖励信息
  bytes result = 5;       // 购买结果
}

// 月卡信息
message GetMonthCardInfosRequest {}

message MonthCardInfo {
  int32 goods_id = 1;
  corepb.Item reward = 2;
  bool can_claim = 3;
}

message GetMonthCardInfosReply {
  repeated MonthCardInfo infos = 1;
}

// 领取月卡奖励
message ClaimMonthCardRewardRequest {
  int32 goods_id = 1;
}

message ClaimMonthCardRewardReply {
  repeated corepb.Item items = 1;
}

// ==== appended from upstream 1.14.2.11_20260922 ====
message PurchaseLimit {
  int32 limit_type = 1;    // 1=daily, 4=activity-period in the captured products.
  int64 bought_count = 2;
  int64 limit_count = 3;
}

message MallShareInfo {
  int64 share_id = 1;
  int64 share_free_count = 2;
  int32 share_status = 3;
  bool share_only = 4;
}

message ProductsHasChangedNotify {
  int32 slot_type = 1;
}

message NeedNotify {
  int32 need_type = 1;
}

// ==== SVIP 分页专用（官方 1.14.2.11）====
// 本地 MallGoods 的 price/limit 是裸 bytes + 手工 varint 解析，与官方 corepb.Item/PurchaseLimit
// 结构不同；官方 slot1 回包用本地 MallGoods 解码会在第 2 条开始崩（invalid wire type），
// 本地面板目前靠 MALL_GOODS_PRICE_OVERRIDES 常量兜着。
// 因此这里新增并列类型，只供 SVIP 分页解析，不动在跑的化肥购买链路。
message MallGoodsV2 {
  int64 goods_id = 1;
  string name = 2;
  int32 goods_type = 3;
  repeated corepb.Item reward_items = 4;
  corepb.Item price = 5;
  bool is_free = 6;
  PurchaseLimit purchase_limit = 7;
  bool is_available = 8;
  string discount_text = 9;
  bool is_discounted = 10;
  int64 discount_end_time = 11;
  int32 product_type = 12;
  string pic = 13;
  int64 discount_price = 14;
  int64 promotion_start_time = 15;
  int64 promotion_end_time = 16;
  int64 ad_id = 17;
  bool ad_only = 18;
  MallShareInfo share = 19;
  bool is_owned = 20;
}

// 官方 PurchaseResponse：field 2 是 success（不是购买数量）。
message PurchaseResponseV2 {
  int64 goods_id = 1;
  bool success = 2;
  repeated corepb.Item reward_items = 3;
  bool is_first_buy = 4;
  PurchaseLimit purchase_limit = 5;
  bool share_free = 6;
  MallShareInfo share = 7;
}
